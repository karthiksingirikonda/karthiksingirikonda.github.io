<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YD Technologies</title>
<meta name="theme-color" content="#2A5FD6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+Telugu:wght@400;700&display=swap">
<style>
:root{--bg:#F4F7FD;--card:#fff;--ink:#1F2A44;--muted:#5A6478;--blue:#2A5FD6;--pink:#C2367C;--green:#1E7F57;--orange:#D16A00;--red:#A12828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Nunito','Noto Sans Telugu',sans-serif;color:var(--ink)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
header b{font-size:18px;flex:1}
main{padding:16px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 4px rgba(31,42,68,.07)}
.big{display:flex;align-items:center;gap:16px;border:none;width:100%;text-align:left;font:inherit;cursor:pointer}
.avatar{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;flex-shrink:0;background-size:cover;background-position:center}
button,.btn{min-height:48px;border-radius:14px;border:none;font:inherit;font-weight:800;font-size:16px;padding:0 16px;cursor:pointer}
.primary{background:var(--blue);color:#fff}.ghost{background:#fff;color:var(--ink)}.green{background:var(--green);color:#fff}.danger{background:#FDECEC;color:var(--red)}
.slot{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:#fff}
.slot .t{width:56px;font-weight:800;color:var(--blue)}
.slot.amma{background:#FFF7E6;border:2px dashed #E8A33A}
.slot.now{background:var(--blue);color:#fff}.slot.now .t{color:#fff}
.tag{font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.kt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:22px;min-height:104px;font-size:17px;font-weight:800;color:#1F2A44;box-shadow:0 2px 8px #0001}.kt span{font-size:40px;line-height:1}.kt.clsnow{outline:4px solid #F2A900;animation:pulse 1.6s infinite}.kt.sm{min-height:80px;font-size:14px;background:#F4F6FA}.kt.sm span{font-size:28px}
.live{display:block;margin:14px auto 4px;background:#6B3FD9;color:#fff;border:0;border-radius:26px;padding:13px 26px;font-size:19px;font-weight:800;box-shadow:0 4px 14px #6B3FD955}.live.on{background:#C62828}
.mic{width:110px;height:110px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 0 0 12px #D5E2FB}
.mic.listen{animation:pulse 1.2s infinite}.mic.sleep{background:#9AA3B5;box-shadow:0 0 0 12px #E6E9EF}
@keyframes pulse{50%{box-shadow:0 0 0 20px #C6D7FA}}
.bubble{padding:12px 14px;border-radius:16px;line-height:1.45;font-size:17px}
.me{background:#EEF1F7;align-self:flex-end}.helper{background:#E8F0FE}
#screenShow img{width:100%;border-radius:16px}
#screenShow iframe{width:100%;height:260px;border:0;border-radius:16px}
input,select,textarea{width:100%;min-height:48px;border:2px solid #DDE3EE;border-radius:12px;padding:10px;font:inherit;font-size:16px}
label{font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap;min-height:40px;font-size:14px;background:#fff}
.tabs button.on{background:var(--green);color:#fff}
.muted{color:var(--muted);font-size:14px}
.hidden{display:none!important}
#askFab{position:relative}#askFab .dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#E53935;border:2px solid #fff}
.pmsg{align-self:flex-end;background:#EEF1F7;border-radius:14px;padding:8px 12px;max-width:85%}.cmsg{align-self:flex-start;background:#E8F0FE;border-radius:14px;padding:8px 12px;max-width:90%}.smsg{align-self:stretch;border:2px solid #DDE3EE;border-radius:14px;padding:8px 12px}.mt{font-size:11px;color:#5A6478;margin-top:2px}
.chip{background:#E2F5EC;color:#157A52;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700}
#micHint{display:table;margin:4px auto 0;padding:9px 16px;border-radius:999px;font-weight:800;font-size:16px;text-align:center;background:#EEF0F4;color:#4A5263}
#micHint.st-listen{background:#DDF5E3;color:#17602B}#micHint.st-think{background:#FFF1C7;color:#6E5100}#micHint.st-speak{background:#DCE7FF;color:#1C4AAE}
#micHint::before{content:'';display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;background:#A3AAB8;vertical-align:1px}
#micHint.st-listen::before{background:#22A045;animation:pulse 1.2s infinite}#micHint.st-think::before{background:#E0A800}#micHint.st-speak::before{background:#2F6FED}
.mic.speak{background:#2F6FED;box-shadow:0 0 0 12px #CFE0FF}.mic.think{background:#E0A800;box-shadow:0 0 0 12px #FFF1C7}
#kidBadge{width:36px;height:36px;border-radius:50%;object-fit:cover;border:3px solid #2F6FED;flex:none;background:#EEF1F7;display:flex;align-items:center;justify-content:center;font-weight:800;color:#1F2A44;background-size:cover;background-position:center}
</style>
</head>
<body>
<header><button class="ghost hidden" id="backBtn" aria-label="Back" onclick="goBack()">&#8592;</button><b id="appTitle">YD Technologies</b><span class="muted" id="todayLbl"></span><span id="kidBadge" class="hidden" aria-label="Whose screen"></span><button class="ghost" id="tmBtn" aria-label="Timer and stopwatch" onclick="tmOpen()" style="min-height:40px;font-size:20px;padding:0 10px">⏱</button><button class="green hidden" id="askFab" aria-label="Ask for a change" onclick="askOpen()" style="min-height:40px;font-size:14px;padding:0 12px">&#10022;</button></header>
<div id="askPanel" class="hidden" style="position:fixed;left:12px;right:12px;top:70px;z-index:20;background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 30px rgba(31,42,68,.25);max-width:520px;margin:0 auto"></div>
<main id="app"></main>

<script>
let BOOT=null, CHILD=null, ADMIN=null, MODE='chat';
const $=s=>document.querySelector(s);
let FTOK=null;try{FTOK=localStorage.getItem('ydFam')}catch(e){}
const EXEC='https://script.google.com/macros/s/AKfycbzlbBcB1A44zfK6o79kL52P6fLARg079FUkOJohUEW68c3diEe0JzLLyGw1zfl_sLRN/exec';
async function post(body){const r=await fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}
const net=(fn,args)=>post({tok:FTOK,name:fn,args:args}).then(j=>{if(!j.ok)throw new Error(j.error);return j.data}).catch(e=>{if(/FAMILY_CODE/.test(e.message)){try{localStorage.removeItem('ydFam')}catch(x){}FTOK=null;familyScreen()}else toast(/Failed to fetch|NetworkError|Load failed/.test(e.message)?'No internet – please try again':((typeof onKidView==='function'&&onKidView())||/402|depleted|billing|quota/i.test(e.message)?'Sorry, please say that again':String(e.message).replace(/ai ?studio|gemini|google|claude|anthropic|openai/gi,'service')));throw e});
/* ---------- speed: phone-side copy of everything, refreshed quietly ---------- */
const READS=new Set(['getBoot','getToday','getHomework','getStars','getVideos','getRoutine','adminToday','adminGetTimetable','adminRequests','adminThread']);
const QUIET_WRITES=new Set(['homeworkUpdate','claimStar','markVideoShown','logTimer']);
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
let MEM={day:dayKey(),data:{}};try{const m=JSON.parse(localStorage.getItem('ydCache')||'null');if(m&&m.day===dayKey())MEM=m}catch(e){}
let saveT=null;function memSave(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('ydCache',JSON.stringify(MEM))}catch(e){}},300)}
const ckey=(fn,args)=>fn+'|'+JSON.stringify(fn.startsWith('admin')?args.slice(1):args);
const memGet=k=>MEM.data[k]===undefined?undefined:JSON.parse(JSON.stringify(MEM.data[k]));
function memPut(k,v){MEM.data[k]=v;memSave()}
let LASTVIEW=null,PENDINGVIEW=null,QUIET=false,NAVSEQ=0;const APPVER='v46 · Sat 14/11 20:10';const inflight={};
function rerender(){const nv=getNav();if(nv&&nv.v==='admin')return;if(NAVSEQ!==RENDERSEQ)return;const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;const b=memGet(ckey('getBoot',[]));if(b&&typeof BOOT!=='undefined'&&BOOT){BOOT=b;if(CHILD)CHILD=BOOT.children.find(c=>c.id===CHILD.id)||CHILD}if(LASTVIEW&&!$('#askPanel:not(.hidden)')&&!RT){QUIET=true;try{LASTVIEW()}catch(e){}setTimeout(()=>QUIET=false,50)}}
function refreshKey(fn,args,k){if(inflight[k])return inflight[k];inflight[k]=net(fn,args).then(d=>{const old=JSON.stringify(MEM.data[k]);memPut(k,d);if(old!==JSON.stringify(d))rerender();return d}).finally(()=>delete inflight[k]);return inflight[k]}
let bundleT=null;function refreshBundle(delay){clearTimeout(bundleT);bundleT=setTimeout(()=>{net('getBundle',[]).then(b=>{let changed=false;Object.keys(b).forEach(k=>{if(JSON.stringify(MEM.data[k])!==JSON.stringify(b[k])){MEM.data[k]=b[k];changed=true}});memSave();if(changed)rerender()}).catch(()=>{})},delay||0)}
function patchLocal(fn,a){
 if(fn==='homeworkUpdate')Object.keys(MEM.data).filter(k=>k.startsWith('getHomework|')).forEach(k=>MEM.data[k].forEach(h=>{if(h.id===a[0])h.status=a[1]}));
 if(fn==='claimStar'){const s=MEM.data['getStars|'+JSON.stringify([a[0]])];if(s)s.today.push({item:a[1],status:'waiting'});const t=MEM.data['getToday|'+JSON.stringify([a[0]])];if(t)t.starsWaiting++}
 if(fn==='markVideoShown')Object.keys(MEM.data).filter(k=>k.startsWith('getVideos|')).forEach(k=>MEM.data[k].forEach(v=>{if(v.id===a[0])v.status=v.status==='Shown'?'Revised':'Shown'}));
 memSave()}
const api=(fn,...args)=>{
 if(READS.has(fn)){const k=ckey(fn,args),c=memGet(k);if(c!==undefined){refreshKey(fn,args,k).catch(()=>{});return Promise.resolve(c)}return refreshKey(fn,args,k).then(d=>JSON.parse(JSON.stringify(d)))}
 if(QUIET_WRITES.has(fn)){patchLocal(fn,args);net(fn,args).then(()=>refreshBundle(1500)).catch(()=>toast('Not saved – please check internet'));return Promise.resolve(true)}
 return net(fn,args).then(d=>{if(fn.startsWith('admin')&&!/Login|CheckToken|Requests$|Today|GetTimetable/.test(fn)){Object.keys(MEM.data).filter(k=>k.startsWith('admin')).forEach(k=>delete MEM.data[k]);refreshBundle(500)}return d})};
setInterval(()=>{if(document.visibilityState==='visible'&&FTOK)refreshBundle()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&FTOK)refreshBundle()});
function familyScreen(msg){$('#backBtn').classList.add('hidden');$('#app').innerHTML=`<div class="card" style="text-align:center;margin-top:30px"><div style="font-size:40px">&#128274;</div><div style="font-size:22px;font-weight:800">Family code</div><div class="muted">Type the 6-number family code once. This phone will remember it.</div>
 <input id="famCode" type="password" inputmode="numeric" maxlength="6" style="text-align:center;font-size:26px;letter-spacing:8px;margin-top:12px"><div id="famMsg" class="muted" style="color:#A12828;min-height:20px">${msg?esc(msg):''}</div><button class="primary" style="width:100%" onclick="famGo()">Open</button></div>`}
function famGo(){const c=$('#famCode').value.trim();post({fn:'familyUnlock',code:c}).then(j=>{if(!j.ok)return familyScreen(j.error);const r=j.data;if(!r.ok)return familyScreen(r.msg);FTOK=r.token;try{localStorage.setItem('ydFam',FTOK)}catch(e){}start()}).catch(e=>familyScreen('No internet – please try again'))}
function micHelp(){const p=$('#askPanel');p.classList.remove('hidden');p.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><b>&#127908; Turn on the microphone</b><button class="ghost" aria-label="Close" onclick="$('#askPanel').classList.add('hidden')">&#10005;</button></div>
 <ol style="padding-left:20px;line-height:1.6;margin:8px 0"><li>At the top, tap the small icon on the left of the web address (lock or sliders).</li><li>Tap <b>Permissions</b> or <b>Site settings</b> &#8594; <b>Microphone</b> &#8594; <b>Allow</b>.</li><li>If there is no Microphone there: phone <b>Settings &#8594; Apps &#8594; Chrome &#8594; Permissions &#8594; Microphone &#8594; Allow</b>.</li><li>Come back and reload this page.</li></ol><div class="muted">You can also type in the box instead.</div>`}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:20px;left:16px;right:16px;background:#1F2A44;color:#fff;padding:12px 14px;border-radius:14px;z-index:9';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let RENDERSEQ=0;
function render(html,showBack){RENDERSEQ=NAVSEQ;LASTVIEW=PENDINGVIEW;PENDINGVIEW=null;$('#app').innerHTML=html;try{kidBadge();watchMic()}catch(e){}$('#backBtn').classList.toggle('hidden',!showBack);if(!QUIET)window.scrollTo(0,0)}

/* ---------- home ---------- */
async function start(){const jm=(location.hash||'').match(/join=([a-f0-9]{20})/);if(jm){history.replaceState(null,'',location.pathname);if(!FTOK){try{const j=await post({fn:'familyJoin',code:jm[1]});const r=j&&j.data;if(r&&r.ok){FTOK=r.token;try{localStorage.setItem('ydFam',FTOK)}catch(e){}}else return familyScreen(r?r.msg:'Link not valid')}catch(e){return familyScreen('No internet – please try again')}}}
 if(!FTOK)return familyScreen();net('voiceReady',[]).then(v=>{GEM=!!(v&&v.gemini)&&PAIDVOICE();0}).catch(()=>{});if(!window.WARM)window.WARM=setInterval(()=>{if(document.visibilityState==='visible'&&FTOK)net('voiceReady',[]).catch(()=>{})},240000);BOOT=await api('getBoot');refreshBundle();$('#appTitle').textContent=BOOT.appName;$('#todayLbl').textContent=BOOT.today;
 let t=null;try{t=JSON.parse(localStorage.getItem('ydAdmin')||'null')}catch(e){}
 if(t&&t.token){ADMIN=t;showFab();api('adminCheckToken',t.token).then(c=>{if(!c.ok){ADMIN=null;try{localStorage.removeItem('ydAdmin')}catch(e){}showFab();const n=getNav();if(n&&n.v==='admin')goHome()}else pollThread()}).catch(()=>{})}
 restoreNav()}
function restoreNav(){const n=getNav()||{v:'home'};const kid=n.id&&BOOT.children.find(c=>c.id===n.id);
 if(kid&&kid.introDone===false&&n.v==='talk')n.v='child';
 if(kid){CHILD=kid;if(n.v==='child')return openChild(n.id);if(n.v==='hw')return openHomework();if(n.v==='stars')return openStars();if(n.v==='videos')return openVideos();if(n.v==='talk')return openTalk(n.mode||'chat',true);if(n.v==='class')return openClass(n.which||'morning');if(n.v==='trace')return openTrace(n.set||'en',n.i||0);if(n.v==='typing')return openTyping();if(n.v==='chess')return openChess();if(n.v==='word')return openWordGame();if(n.v==='games')return openGames();if(n.v==='base')return openBase(n.tab);if(n.v==='dtb')return openBubbles();if(n.v==='dtc')return openColourMatch();if(n.v==='dtr')return openRacer();if(['lvl','lvedit','lvplay'].indexOf(n.v)>=0)return kid.id==='ditya'?lvShared('ditya'):openLevels();if(n.v==='learn')return openLearn();if(n.v==='learnSec')return openLearnSec(n.sec);if(n.v==='learnItem')return openLearnItem(n.sec,n.i);if(n.v==='quiz')return openQuiz(n.kind==='actionsKid'?'actions':n.kind||'groups');if(n.v==='colour')return openColour(n.i||0)}
 if(n.v==='admin'&&ADMIN)return adminHome(n.tab||'today');
 goHome()}
function showFab(){$('#askFab').classList.toggle('hidden',!ADMIN);if(ADMIN)updateDot()}
// Whose screen: the child's small photo in the top corner on every child screen
function kidBadge(){const b=$('#kidBadge');if(!b)return;const n=getNav()||{};const on=CHILD&&n.v&&n.v!=='home'&&n.v!=='admin'&&!ADMIN_VIEW();b.classList.toggle('hidden',!on);if(!on)return;
 const col=CHILD.id==='ditya'?'#C2477F':'#2F6FED';b.style.borderColor=col;if(CHILD.photoUrl){b.style.backgroundImage="url('"+CHILD.photoUrl+"')";b.textContent=''}else{b.style.backgroundImage='';b.textContent=CHILD.name[0]}b.title=CHILD.name}
// Mic status: one clear coloured pill under the mic (green listening, yellow thinking, blue speaking, grey off)
let MICOBS=null;function micStateOf(t){t=String(t||'');if(/Speaking/.test(t))return 'speak';if(/Thinking|One moment|Hearing you/.test(t))return /Hearing/.test(t)?'listen':'think';if(/Listening|speak any time|just talk|talk now/.test(t))return 'listen';return 'off'}
function paintMic(){const h=$('#micHint');if(!h)return;const st=micStateOf(h.textContent);h.className='st-'+st;const m=$('#micBtn');if(m){m.classList.toggle('speak',st==='speak');m.classList.toggle('think',st==='think');if(st==='listen'){m.classList.add('listen');m.classList.remove('sleep')}else if(st==='off'){m.classList.remove('listen');m.classList.add('sleep')}else{m.classList.remove('listen','sleep')}}}
function watchMic(){try{MICOBS&&MICOBS.disconnect()}catch(e){}const h=$('#micHint');if(!h)return;MICOBS=new MutationObserver(paintMic);MICOBS.observe(h,{childList:true,characterData:true,subtree:true});paintMic()}
// Back: from any of a child's screens → that child's page; from the child's page (or Admin) → main screen.
function goBack(){const n=getNav()||{};if(CHILD&&!ADMIN_VIEW()&&n.v==='learnItem'){++NAVSEQ;Voice.stop();return openLearnSec(n.sec)}if(CHILD&&!ADMIN_VIEW()&&n.v==='learnSec'){++NAVSEQ;Voice.stop();return openLearn()}if(CHILD&&['chess','word','typing','quiz','colour','ckid','sudoku','quest','lvl','lvedit','lvplay','base','dtb','dtc','dtr'].indexOf(n.v)>=0&&!ADMIN_VIEW()){++NAVSEQ;Voice.stop();return openGames()}if(CHILD&&n.v&&n.v!=='child'&&n.v!=='home'&&n.v!=='admin'&&!ADMIN_VIEW()){++NAVSEQ;Voice.stop();if(RT){clearInterval(RT.timer);RT.audio&&RT.audio.pause();RT=null}const b=$('#bigTimer');if(b&&!TM&&!SW)b.remove();openChild(CHILD.id)}else goHome()}
// phone/browser back button follows the same rule
try{history.pushState({yd:1},'')}catch(e){}
window.addEventListener('popstate',()=>{const n=getNav()||{};if(n.v&&n.v!=='home'){goBack();try{history.pushState({yd:1},'')}catch(e){}}});
function setNav(o){try{localStorage.setItem('ydNav',JSON.stringify(o))}catch(e){}}
function getNav(){try{return JSON.parse(localStorage.getItem('ydNav')||'null')}catch(e){return null}}
function goHome(){++NAVSEQ;setNav({v:'home'});PENDINGVIEW=()=>goHome();Voice.stop();if(RT){clearInterval(RT.timer);RT.audio&&RT.audio.pause();RT=null}CHILD=null;
 const colors={yuvaan:['#DCE6FB','#2A5FD6'],ditya:['#FBE1EE','#C2367C']};
 const ord=['yuvaan','ditya'],kids=BOOT.children.slice().sort((a,b)=>(ord.indexOf(a.id)+9)%9-(ord.indexOf(b.id)+9)%9);
 render(`<h1 style="margin:4px 0 10px;font-size:26px;text-align:center">Who's learning today?</h1><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">`+
 kids.map(c=>{const col=colors[c.id]||['#eee','#333'];
  return `<button onclick="openChild('${c.id}')" style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 8px;border-radius:20px;border:4px solid ${col[1]};background:${col[0]};min-height:52vh;justify-content:center">
  <div style="font-size:clamp(26px,8vw,40px);font-weight:900;color:${col[1]};line-height:1.1;text-align:center;word-break:break-word;min-height:2.3em;display:flex;align-items:center">${esc(c.name)}</div>
  <div style="width:100%;aspect-ratio:3/4;border-radius:16px;border:4px solid ${col[1]};background:#fff center/cover no-repeat;${c.photoUrl?`background-image:url('${esc(c.photoUrl)}')`:''};display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;color:${col[1]}">${c.photoUrl?'':esc(c.name[0])}</div>
  <div class="muted" style="font-size:14px">Helper: ${esc(c.helperName)}</div></button>`}).join('')+`</div>`+
 `<div class="row" style="justify-content:flex-end"><button class="ghost" onclick="adminLoginScreen()">&#128274; Parents</button></div><div class="muted" style="text-align:center;font-size:12px;margin-top:12px">YD ${APPVER}</div>`)}

/* ---------- child today ---------- */
async function openChild(id){const SEQ=++NAVSEQ;setNav({v:'child',id:id});PENDINGVIEW=()=>openChild(id);CHILD=BOOT.children.find(c=>c.id===id);if(RESTING[id])return showRest();

 alike:{title:'Look-alikes',ask:'Which one is it?',n:2,day:12,segs:true,items:[
  ['raven','🐦‍⬛','Raven: bigger, thick heavy beak, wedge-shaped tail, deep "kronk" croak. Crow: smaller, fan-shaped tail, says "caw-caw".','animals','A big black bird with a thick heavy beak, a wedge-shaped tail and a deep croak. Crow or raven?','crow'],
  ['crow','🐦‍⬛','Crow: smaller, fan-shaped tail, "caw-caw" – seen every day in towns. Raven: bigger, wedge tail, deep croak.','animals','A black bird seen every day in towns, with a fan-shaped tail, that says "caw-caw". Crow or raven?','raven'],
  ['toad','🐸','Toad: dry, bumpy skin and short legs – it walks or makes small hops and lives more on land. Frog: smooth wet skin, long legs, big jumps, near water.','animals','Dry, bumpy skin, short legs, makes small hops and lives mostly on land. Frog or toad?','frog'],
  ['frog','🐸','Frog: smooth, wet skin and long strong legs for big jumps; lives near water. Toad: dry bumpy skin, short legs.','animals','Smooth wet skin, long legs, big jumps, lives near water. Frog or toad?','toad'],
  ['tortoise','🐢','Tortoise: lives only on land, has a high dome-shaped shell and stumpy elephant-like feet. Turtle: lives in water, flatter shell, flippers.','animals','Lives only on land, high dome shell, stumpy elephant-like feet. Turtle or tortoise?','turtle'],
  ['turtle','🐢','Turtle: lives in water, has a flatter shell and flippers for swimming. Tortoise: land only, dome shell, stumpy feet.','animals','Lives in water, flat smooth shell, flippers for swimming. Turtle or tortoise?','tortoise'],
  ['alligator','🐊','Alligator: wide U-shaped snout; its lower teeth hide when the mouth is shut. The name comes from Spanish "el lagarto" – the lizard!','animals','Wide U-shaped snout; you cannot see its lower teeth when its mouth is shut. Crocodile or alligator?','crocodile'],
  ['crocodile','🐊','Crocodile: pointed V-shaped snout; its lower teeth show even when the mouth is shut. Alligator: wide U-shaped snout.','animals','Pointed V-shaped snout; you can see its lower teeth even with the mouth shut. Crocodile or alligator?','alligator'],
  ['moth','🦋','Moth: flies at night, feathery antennae, rests with wings flat, usually dull colours. Butterfly: day, thin antennae with knobs, wings folded up.','insects','Flies at night, has feathery antennae and rests with its wings spread flat. Butterfly or moth?','butterfly'],
  ['butterfly','🦋','Butterfly: flies in the day, thin antennae with little knobs at the tips, rests with wings folded up, bright colours.','insects','Flies in the day, thin antennae with knobs at the tips, rests with wings folded up. Butterfly or moth?','moth'],
  ['hare','🐇','Hare: bigger, very long ears with black tips, long legs; its babies are born with fur and open eyes and live above ground. Rabbit: smaller, babies born blind in burrows.','animals','Bigger, very long ears with black tips, long legs, babies born with fur and open eyes. Rabbit or hare?','rabbit'],
  ['rabbit','🐇','Rabbit: smaller, shorter ears, lives in burrows; its babies are born without fur and with closed eyes. Hare: bigger, longer legs and ears.','animals','Smaller, lives in burrows under the ground, babies born without fur and with closed eyes. Rabbit or hare?','hare'],
  ['wasp','🐝','Wasp: smooth, shiny body with a very thin waist; it hunts other insects and does not make honey. Bee: fuzzy, hairy, makes honey.','insects','Smooth shiny body, very thin waist, hunts other insects, makes no honey. Bee or wasp?','bee'],
  ['bee','🐝','Bee: fuzzy, hairy body that collects pollen; it makes honey. Wasp: smooth, shiny, thin waist.','insects','Fuzzy hairy body covered in pollen, makes honey. Bee or wasp?','wasp'],
  ['porpoise','🐬','Porpoise: short, blunt face, small triangle fin and flat spade-shaped teeth. Its name comes from Latin words meaning "pig fish"!','sea','Short blunt face, small triangle-shaped fin, spade-shaped teeth. Dolphin or porpoise?','dolphin'],
  ['dolphin','🐬','Dolphin: long beak-like nose, curved fin and cone-shaped teeth. Porpoise: blunt face, triangle fin.','sea','Long beak-like nose, curved back fin, cone-shaped teeth. Dolphin or porpoise?','porpoise'],
  ['sea lion','🦭','Sea lion: has small ear flaps and walks on its big flippers. The males have a lion-like mane and roar – that is why it is called a sea lion!','sea','Has small ear flaps and can walk on its big flippers on land. Seal or sea lion?','seal'],
  ['seal','🦭','Seal: no ear flaps (just holes) and it wriggles on its belly on land. Sea lion: ear flaps and walks on flippers.','sea','No ear flaps, just tiny holes, and it wriggles on its belly on land. Seal or sea lion?','sea lion'],
  ['cheetah','🐆','Cheetah: solid round black spots and black "tear lines" from its eyes; slim and the fastest runner. The name comes from the Hindi word "chita" – spotted.','animals','Solid round spots, black tear lines running down from its eyes, slim and the fastest runner. Leopard or cheetah?','leopard'],
  ['leopard','🐆','Leopard: flower-like ring spots (rosettes), strong body, carries its food up trees. The name joins Greek words for lion and panther.','animals','Flower-like ring spots, strong body, drags its food up into trees. Leopard or cheetah?','cheetah'],
  ['rat','🐀','Rat: bigger, thick long tail, small ears and a blunt nose. Mouse: tiny, big round ears, thin tail.','animals','Bigger, thick tail, small ears and a blunt nose. Mouse or rat?','mouse'],
  ['mouse','🐁','Mouse: tiny, big round ears, pointed nose and a thin tail. Rat: bigger with a thick tail.','animals','Tiny, big round ears, pointed nose, thin tail. Mouse or rat?','rat'],
  ['llama','🦙','Llama: bigger, long banana-shaped ears, carries loads for people. Alpaca: smaller, short pointed ears, very soft wool.','animals','Big, long banana-shaped ears, carries heavy loads up mountains. Llama or alpaca?','alpaca'],
  ['alpaca','🦙','Alpaca: smaller, short pointed ears and very soft, fluffy wool. Llama: bigger, banana ears, carries loads.','animals','Smaller, short pointed ears, kept for its very soft fluffy wool. Llama or alpaca?','llama'],
  ['ape','🦍','Ape (gorilla, chimpanzee): NO tail and bigger; apes can swing and walk on two legs. Monkey: has a tail.','animals','Has no tail at all, big and strong, like a gorilla or chimpanzee. Monkey or ape?','monkey'],
  ['monkey','🐒','Monkey: has a tail and is usually smaller. Ape: no tail.','animals','Has a long tail and jumps from branch to branch. Monkey or ape?','ape'],
  ['ostrich','🪶','Ostrich: lives in Africa, the biggest bird of all, long bare neck and only two toes on each foot. Emu: Australia, three toes.','birds','Biggest bird in the world, lives in Africa, long bare neck, two toes. Emu or ostrich?','emu'],
  ['emu','🪶','Emu: lives in Australia, shaggy brown feathers and three toes on each foot. Ostrich: Africa, biggest, two toes.','birds','Lives in Australia, shaggy brown feathers, three toes on each foot. Emu or ostrich?','ostrich'],
  ['octopus','🐙','Octopus: 8 arms and a round head; it hides in caves. Its name means "eight feet" in Greek! Squid: 8 arms plus 2 long tentacles.','sea','8 arms, round soft head, hides in rocky caves. Squid or octopus?','squid'],
  ['squid','🦑','Squid: 8 arms PLUS 2 long tentacles and a long body with fins; it swims in open water. Octopus: 8 arms, round head.','sea','8 arms plus 2 extra-long tentacles, long body with fins, swims in open water. Squid or octopus?','octopus'],
  ['lime','🍋‍🟩','Lime: small, round and green, very sour. Lemon: bigger, oval and yellow.','food','Small, round and green, very sour. Lemon or lime?','lemon'],
  ['lemon','🍋','Lemon: bigger, oval shape and bright yellow. Lime: small, round, green.','food','Bigger, oval shape, bright yellow. Lemon or lime?','lime']]},

 const norm=x=>String(x||'').toLowerCase().replace(/[^a-z\u0c00-\u0c7f ]/g,' ').replace(/\s+/g,' ').trim();
 function start(){if(!SR||on||!CHILD)return;const name=norm(CHILD.helperName);if(!name)return;on=true;try{r=new SR();r.lang='en-IN';r.continuous=true;r.interimResults=true;
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=norm(e.results[i][0].transcript);let k=t.indexOf(name);if(k<0&&name.length>6)k=t.indexOf(name.slice(0,6));if(k>=0&&(e.results[i].isFinal||t.length-k-name.length<2)){const rest=e.results[i].isFinal?t.slice(k).split(' ').slice(name.split(' ').length).join(' ').trim():'';stop();woke(rest);return}}};
  r.onend=()=>{r=null;on=false};r.onerror=()=>{};r.start()}catch(e){on=false;r=null}}
 function stop(){on=false;try{r&&r.abort()}catch(e){}r=null}
 return{start,stop,get on(){return on},ok:!!SR}})();

function chime(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(0.15,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.25);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.25);setTimeout(()=>c.close(),400)}catch(e){}}

const TE_NUM={'ఒక':1,'ఒకటి':1,'రెండు':2,'మూడు':3,'నాలుగు':4,'ఐదు':5,'అయిదు':5,'ఆరు':6,'ఏడు':7,'ఎనిమిది':8,'తొమ్మిది':9,'పది':10,'పదిహేను':15,'ఇరవై':20,'ముప్పై':30};
const EN_NUM={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,fifteen:15,twenty:20,thirty:30};
let SW=null,TM=null;
function numIn(s){const d=s.match(/\d+/);if(d)return +d[0];for(const k in TE_NUM)if(s.includes(k))return TE_NUM[k];for(const k in EN_NUM)if(s.toLowerCase().includes(k))return EN_NUM[k];return null}
function localCommand(said){const s=said.toLowerCase();
 if(/stop ?watch|స్టాప్ ?వాచ్|స్టాప్‌వాచ్/.test(s)){if(/stop|ఆపు|ఆపేయ్/.test(s.replace(/stop ?watch/,''))&&SW){stopStopwatch();return true}startStopwatch();return true}
 if(/timer|టైమర్/.test(s)&&TM&&/pause|wait|hold|ఆగు|పాజ్/.test(s)){pauseTimer();return true}
 if(/timer|టైమర్/.test(s)&&TM&&/resume|continue|start again|మళ్ళీ|కంటిన్యూ|రెజ్యూమ్/.test(s)&&TM.paused!=null){resumeTimer();return true}
 if(/timer|టైమర్/.test(s)&&TM&&/stop|off|cancel|ఆపు|ఆపేయ్|ఆఫ్|క్యాన్సిల్/.test(s)){stopTimer();return true}
 if(/timer|టైమర్/.test(s)){const n=numIn(s);if(!n){Voice.speak('How many minutes should I set the timer for?','en');return true}const sec=/sec|సెకన్/.test(s)?n:n*60;startTimer(sec);return true}
 if(/what.*time|time now|టైం ఎంత|ఎన్ని గంటలు|సమయం ఎంత/.test(s)){const d=new Date();const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),h=d.getHours(),part=h<12?'in the morning':h<16?'in the afternoon':h<19?'in the evening':'at night',say=CHILD&&CHILD.id==='ditya'?'It is '+t12(hm).replace(/ (AM|PM)$/,'')+' '+part:'It is '+t12(hm);addBubble('helper',say);Voice.speak(say,'en');return true}
 return false}
function bigBox(html){let b=$('#bigTimer');if(!b){b=document.createElement('div');b.id='bigTimer';b.style.cssText='position:fixed;top:62px;right:12px;background:#1F2A44;color:#fff;border-radius:16px;padding:8px 16px;text-align:center;z-index:8;font-size:30px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer';b.onclick=tmOpen;document.body.appendChild(b)}b.innerHTML=html}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function startStopwatch(){const t0=Date.now();clearInterval(SW&&SW.i);SW={t0:t0,i:setInterval(()=>bigBox(mmss((Date.now()-t0)/1000)+'<div style="font-size:13px">⏱ stopwatch · tap</div>'),500)};$('#bigTimer')||bigBox('0:00');Voice.speak('Stopwatch started!','en')}
function stopStopwatch(){if(!SW)return;const sec=(Date.now()-SW.t0)/1000;clearInterval(SW.i);SW=null;bigBox(mmss(sec)+'<div style="font-size:15px">done</div>');setTimeout(()=>{const b=$('#bigTimer');b&&b.remove()},4000);if(CHILD)api('logTimer',CHILD.id,'stopwatch','',Math.round(sec));Voice.speak(Math.floor(sec/60)+' minutes '+Math.round(sec%60)+' seconds in total. Nice!','en')}
function startTimer(sec,quiet){clearInterval(TM&&TM.i);const end=Date.now()+sec*1000;TM={sec:sec,end:end,i:setInterval(()=>{const left=(end-Date.now())/1000;bigBox(mmss(left)+'<div style="font-size:13px">⏲ timer · tap</div>');if(left<=0){clearInterval(TM.i);TM=null;const b=$('#bigTimer');b&&b.remove();if(CHILD)api('logTimer',CHILD.id,'timer','',sec);Voice.speak('Time is up! How much is done? How much more time do you need?','en')}},500)};if(!quiet)Voice.speak('Timer set for '+Math.round(sec/60)+' minutes.','en')}
function pauseTimer(){if(!TM||TM.paused!=null)return;clearInterval(TM.i);TM.paused=Math.max(0,(TM.end-Date.now())/1000);bigBox(mmss(TM.paused)+'<div style="font-size:15px">paused</div>');Voice.speak('Timer paused. Tell me when to start again.','en')}
function resumeTimer(){if(!TM||TM.paused==null)return;startTimer(TM.paused,true);Voice.speak('Timer started again.','en')}
function stopTimer(){if(!TM)return;clearInterval(TM.i);TM=null;const b=$('#bigTimer');b&&b.remove();Voice.speak('Timer is off.','en')}

 try{localStorage.setItem(clrKey(d),JSON.stringify(R))}catch(e){}if(show)clrShow(R);
 const st=R.items.filter(i=>i.stale);if(!st.length)return;
 await Promise.all(st.map(i=>net('adminClassReport',[ADMIN.token,d,true,i.child,i.which]).then(R2=>{R=R2;try{localStorage.setItem(clrKey(d),JSON.stringify(R2))}catch(e){}if($('#clrOut'))clrShow(R2)}).catch(()=>{})));
 if(!$('#clrOut'))toast('🌅 Class report ready')}
function clrHtml(R){if(!R||!R.items.length)return `<div class="card muted">No class on ${hwrDay(R?R.date:hwrIso(new Date()))}.</div>`;
 const L=(t,v)=>v?`<div style="margin-top:6px"><b>${t}</b> ${esc(v)}</div>`:'';
 return R.items.map(it=>{const r=it.rep,p=it.plan||{steps:[]},done=(r&&r.stepsDone)||[];
  const head=`<div class="row" style="justify-content:space-between;align-items:center"><b style="font-size:18px">${it.which==='morning'?'🌅 Morning':'🌇 Evening'} class · ${esc(it.childName)}</b><span class="muted">${hwrDay(R.date)}</span></div>`;
  if(!r)return `<div class="card">${head}<div class="muted" style="margin-top:6px">${it.turns?'⏳ Report being prepared – it appears here by itself.':'Class not started yet.'}</div></div>`;
  return `<div class="card">${head}
  <div class="muted" style="margin-top:4px">${r.minutes||0} min · ${r.turns||0} answers${r.mood?' · mood: '+esc(r.mood):''}${it.stale?' · ⏳ updating':''}</div>
  ${L('📒',r.line)}
  ${r.learned&&r.learned.length?`<div style="margin-top:8px"><b>✅ Learned</b>${r.learned.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>`:''}
  ${L('💪 Strong:',r.strong)}${L('🧩 Hard:',r.weak)}
  ${r.revise&&r.revise.length?`<div style="margin-top:8px;background:#FFF6DD;border-radius:10px;padding:8px"><b>🔁 Revise next class</b>${r.revise.map(x=>`<div>• ${esc(x.q)} <span class="muted">(${esc(x.a)})</span></div>`).join('')}</div>`:''}
  ${L('📰 News:',r.news)}${L('📖 Story:',r.story)}${L('🇮🇳 GK:',r.gk)}${L('🗣️ Hindi:',r.hindi)}${L('📚 Book:',r.book)}${L('✍️ English:',r.english)}
  ${r.carry&&r.carry.length?`<div style="margin-top:8px;background:#EEF3FF;border-radius:10px;padding:8px"><b>➡️ Carries to next class</b>${r.carry.map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>`:''}
  ${L('❓ Wants to know:',r.tomorrow)}
  <details style="margin-top:8px"><summary class="muted">Plan steps</summary>${(p.steps||[]).map(s=>`<div>${done.some(x=>String(x).toLowerCase().indexOf(String(s.title).toLowerCase().replace(/[^a-z ]/g,'').trim().slice(0,12))>=0)?'✅':'⬜'} ${esc(s.title)}</div>`).join('')}</details></div>`}).join('')+
 `<div class="card"><b>Share</b><div class="grid2" style="margin-top:8px"><button onclick="clrCopy()">📋 Copy text</button><button class="green" onclick="clrWa()">Open in WhatsApp</button></div></div>`}
function clrText(){const R=CLR;if(!R)return '';return ['🌅 *Class report – '+hwrDay(R.date)+'*'].concat(R.items.filter(i=>i.rep).map(i=>{const r=i.rep;return '\n*'+(i.which==='morning'?'Morning':'Evening')+' class – '+i.childName+'* ('+(r.minutes||0)+' min)\n'+(r.line||'')+(r.learned&&r.learned.length?'\n✅ Learned: '+r.learned.join('; '):'')+(r.weak?'\n🧩 Hard: '+r.weak:'')+(r.revise&&r.revise.length?'\n🔁 Revise: '+r.revise.map(x=>x.q).join('; '):'')+(r.carry&&r.carry.length?'\n➡️ Next class: '+r.carry.join('; '):'')})).join('\n')}
function clrCopy(){navigator.clipboard.writeText(clrText()).then(()=>toast('Copied – paste in WhatsApp')).catch(()=>toast('Could not copy'))}
function clrWa(){window.open('https://wa.me/?text='+encodeURIComponent(clrText()),'_blank')}

/* ---------- 📝 HW report: kept on the phone, opens at once; missing parts are made in the background ---------- */
function hwrKey(d){return 'ydHWR_'+d}
let HWRBUSY={};
async function hwrFetch(d,show){if(HWRBUSY[d])return;HWRBUSY[d]=1;try{let R;try{R=await net('adminHwReport',[ADMIN.token,d,true])}catch(e){if(show&&$('#hwrOut')&&!HWR)$('#hwrOut').innerHTML='<div class="card">Could not load the report. Please try again.</div>';return}
 {let old=null;try{old=JSON.parse(localStorage.getItem(hwrKey(d))||'null')}catch(e){}if(old)R.items.forEach(x=>{if(!x.rep){const o=old.items.find(y=>y.id===x.id);if(o&&o.rep)x.rep=o.rep}})}
 const save=()=>{try{localStorage.setItem(hwrKey(d),JSON.stringify(R))}catch(e){}if($('#hwrOut')&&$('#hwrDate')&&$('#hwrDate').value===d){HWR=R;$('#hwrOut').innerHTML=hwrHtml(R)}};save();
 const st=R.items.filter(i=>i.stale&&i.turns);if(!st.length)return;
 await Promise.all(st.map(i=>net('adminHwReport',[ADMIN.token,d,false,i.id]).then(R2=>{const n=R2.items.find(x=>x.id===i.id);if(n){R.items=R.items.map(x=>x.id===i.id?n:x)}save()}).catch(()=>{})));
 if(!$('#hwrOut'))toast('📝 Homework report ready')}finally{delete HWRBUSY[d]}}
function adminPrefetch(){if(!ADMIN||window.__APF)return;window.__APF=1;const d=hwrIso(new Date());setTimeout(()=>{hwrFetch(d,false);clrFetch(d,false)},1500)}


function voiceCard(){const paid=PAIDVOICE();return `<div class="card"><b>🔊 Voice on this device</b><div class="muted">${paid?'Paid natural voice (costs money; Live talk on)':'Free phone voice and mic (₹0) – Buddy reads with the phone\'s voice'}</div><button style="margin-top:6px" onclick="setPaidVoice(${paid?0:1})">${paid?'Switch to free voice':'Use paid natural voice'}</button></div>`}
function setPaidVoice(on){try{localStorage.setItem('ydPaidVoice',on?'1':'0')}catch(e){}toast(on?'Paid voice on – reloading':'Free voice on – reloading');setTimeout(()=>location.reload(),900)}
</script>
