<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YD Technologies</title>
<meta name="theme-color" content="#2A5FD6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+Telugu:wght@400;700&display=swap">
<style>
:root{--bg:#F4F7FD;--card:#fff;--ink:#1F2A44;--muted:#5A6478;--blue:#2A5FD6;--pink:#C2367C;--green:#1E7F57;--orange:#D16A00;--red:#A12828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Nunito','Noto Sans Telugu',sans-serif;color:var(--ink)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
header b{font-size:18px;flex:1}
main{padding:16px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 4px rgba(31,42,68,.07)}
.big{display:flex;align-items:center;gap:16px;border:none;width:100%;text-align:left;font:inherit;cursor:pointer}
.avatar{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;flex-shrink:0;background-size:cover;background-position:center}
button,.btn{min-height:48px;border-radius:14px;border:none;font:inherit;font-weight:800;font-size:16px;padding:0 16px;cursor:pointer}
.primary{background:var(--blue);color:#fff}.ghost{background:#fff;color:var(--ink)}.green{background:var(--green);color:#fff}.danger{background:#FDECEC;color:var(--red)}
.slot{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:#fff}
.slot .t{width:56px;font-weight:800;color:var(--blue)}
.slot.amma{background:#FFF7E6;border:2px dashed #E8A33A}
.slot.now{background:var(--blue);color:#fff}.slot.now .t{color:#fff}
.tag{font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mic{width:110px;height:110px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 0 0 12px #D5E2FB}
.mic.listen{animation:pulse 1.2s infinite}.mic.sleep{background:#9AA3B5;box-shadow:0 0 0 12px #E6E9EF}
@keyframes pulse{50%{box-shadow:0 0 0 20px #C6D7FA}}
.bubble{padding:12px 14px;border-radius:16px;line-height:1.45;font-size:17px}
.me{background:#EEF1F7;align-self:flex-end}.helper{background:#E8F0FE}
#screenShow img{width:100%;border-radius:16px}
#screenShow iframe{width:100%;height:260px;border:0;border-radius:16px}
input,select,textarea{width:100%;min-height:48px;border:2px solid #DDE3EE;border-radius:12px;padding:10px;font:inherit;font-size:16px}
label{font-weight:700;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap;min-height:40px;font-size:14px;background:#fff}
.tabs button.on{background:var(--green);color:#fff}
.muted{color:var(--muted);font-size:14px}
.hidden{display:none!important}
#askFab{position:relative}#askFab .dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#E53935;border:2px solid #fff}
.pmsg{align-self:flex-end;background:#EEF1F7;border-radius:14px;padding:8px 12px;max-width:85%}.cmsg{align-self:flex-start;background:#E8F0FE;border-radius:14px;padding:8px 12px;max-width:90%}.smsg{align-self:stretch;border:2px solid #DDE3EE;border-radius:14px;padding:8px 12px}.mt{font-size:11px;color:#5A6478;margin-top:2px}
.chip{background:#E2F5EC;color:#157A52;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<header><button class="ghost hidden" id="backBtn" aria-label="Back" onclick="goHome()">&#8592;</button><b id="appTitle">YD Technologies</b><span class="muted" id="todayLbl"></span><button class="green hidden" id="askFab" aria-label="Ask Claude for a change" onclick="askOpen()" style="min-height:40px;font-size:14px;padding:0 12px">&#10022; Claude</button></header>
<div id="askPanel" class="hidden" style="position:fixed;left:12px;right:12px;top:70px;z-index:20;background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 30px rgba(31,42,68,.25);max-width:520px;margin:0 auto"></div>
<main id="app"></main>

<script>
let BOOT=null, CHILD=null, ADMIN=null, MODE='chat';
const $=s=>document.querySelector(s);
let FTOK=null;try{FTOK=localStorage.getItem('ydFam')}catch(e){}
const EXEC='https://script.google.com/macros/s/AKfycbzlbBcB1A44zfK6o79kL52P6fLARg079FUkOJohUEW68c3diEe0JzLLyGw1zfl_sLRN/exec';
async function post(body){const r=await fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}
const net=(fn,args)=>post({tok:FTOK,name:fn,args:args}).then(j=>{if(!j.ok)throw new Error(j.error);return j.data}).catch(e=>{if(/FAMILY_CODE/.test(e.message)){try{localStorage.removeItem('ydFam')}catch(x){}FTOK=null;familyScreen()}else toast(/Failed to fetch|NetworkError|Load failed/.test(e.message)?'No internet – please try again':e.message);throw e});
/* ---------- speed: phone-side copy of everything, refreshed quietly ---------- */
const READS=new Set(['getBoot','getToday','getHomework','getStars','getVideos','getRoutine','adminToday','adminGetTimetable','adminRequests','adminThread']);
const QUIET_WRITES=new Set(['homeworkUpdate','claimStar','markVideoShown','logTimer']);
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
let MEM={day:dayKey(),data:{}};try{const m=JSON.parse(localStorage.getItem('ydCache')||'null');if(m&&m.day===dayKey())MEM=m}catch(e){}
let saveT=null;function memSave(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('ydCache',JSON.stringify(MEM))}catch(e){}},300)}
const ckey=(fn,args)=>fn+'|'+JSON.stringify(fn.startsWith('admin')?args.slice(1):args);
const memGet=k=>MEM.data[k]===undefined?undefined:JSON.parse(JSON.stringify(MEM.data[k]));
function memPut(k,v){MEM.data[k]=v;memSave()}
let LASTVIEW=null,PENDINGVIEW=null,QUIET=false;const inflight={};
function rerender(){const b=memGet(ckey('getBoot',[]));if(b&&typeof BOOT!=='undefined'&&BOOT){BOOT=b;if(CHILD)CHILD=BOOT.children.find(c=>c.id===CHILD.id)||CHILD}if(LASTVIEW&&!$('#askPanel:not(.hidden)')&&!RT){QUIET=true;try{LASTVIEW()}catch(e){}setTimeout(()=>QUIET=false,50)}}
function refreshKey(fn,args,k){if(inflight[k])return inflight[k];inflight[k]=net(fn,args).then(d=>{const old=JSON.stringify(MEM.data[k]);memPut(k,d);if(old!==JSON.stringify(d))rerender();return d}).finally(()=>delete inflight[k]);return inflight[k]}
let bundleT=null;function refreshBundle(delay){clearTimeout(bundleT);bundleT=setTimeout(()=>{net('getBundle',[]).then(b=>{let changed=false;Object.keys(b).forEach(k=>{if(JSON.stringify(MEM.data[k])!==JSON.stringify(b[k])){MEM.data[k]=b[k];changed=true}});memSave();if(changed)rerender()}).catch(()=>{})},delay||0)}
function patchLocal(fn,a){
 if(fn==='homeworkUpdate')Object.keys(MEM.data).filter(k=>k.startsWith('getHomework|')).forEach(k=>MEM.data[k].forEach(h=>{if(h.id===a[0])h.status=a[1]}));
 if(fn==='claimStar'){const s=MEM.data['getStars|'+JSON.stringify([a[0]])];if(s)s.today.push({item:a[1],status:'waiting'});const t=MEM.data['getToday|'+JSON.stringify([a[0]])];if(t)t.starsWaiting++}
 if(fn==='markVideoShown')Object.keys(MEM.data).filter(k=>k.startsWith('getVideos|')).forEach(k=>MEM.data[k].forEach(v=>{if(v.id===a[0])v.status=v.status==='Shown'?'Revised':'Shown'}));
 memSave()}
const api=(fn,...args)=>{
 if(READS.has(fn)){const k=ckey(fn,args),c=memGet(k);if(c!==undefined){refreshKey(fn,args,k).catch(()=>{});return Promise.resolve(c)}return refreshKey(fn,args,k).then(d=>JSON.parse(JSON.stringify(d)))}
 if(QUIET_WRITES.has(fn)){patchLocal(fn,args);net(fn,args).then(()=>refreshBundle(1500)).catch(()=>toast('Not saved – please check internet'));return Promise.resolve(true)}
 return net(fn,args).then(d=>{if(fn.startsWith('admin')&&!/Login|CheckToken|Requests$|Today|GetTimetable/.test(fn)){Object.keys(MEM.data).filter(k=>k.startsWith('admin')).forEach(k=>delete MEM.data[k]);refreshBundle(500)}return d})};
setInterval(()=>{if(document.visibilityState==='visible'&&FTOK)refreshBundle()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&FTOK)refreshBundle()});
function familyScreen(msg){$('#backBtn').classList.add('hidden');$('#app').innerHTML=`<div class="card" style="text-align:center;margin-top:30px"><div style="font-size:40px">&#128274;</div><div style="font-size:22px;font-weight:800">Family code</div><div class="muted">Type the 6-number family code once. This phone will remember it.</div>
 <input id="famCode" type="password" inputmode="numeric" maxlength="6" style="text-align:center;font-size:26px;letter-spacing:8px;margin-top:12px"><div id="famMsg" class="muted" style="color:#A12828;min-height:20px">${msg?esc(msg):''}</div><button class="primary" style="width:100%" onclick="famGo()">Open</button></div>`}
function famGo(){const c=$('#famCode').value.trim();post({fn:'familyUnlock',code:c}).then(j=>{if(!j.ok)return familyScreen(j.error);const r=j.data;if(!r.ok)return familyScreen(r.msg);FTOK=r.token;try{localStorage.setItem('ydFam',FTOK)}catch(e){}start()}).catch(e=>familyScreen('No internet – please try again'))}
function micHelp(){const p=$('#askPanel');p.classList.remove('hidden');p.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><b>&#127908; Turn on the microphone</b><button class="ghost" aria-label="Close" onclick="$('#askPanel').classList.add('hidden')">&#10005;</button></div>
 <ol style="padding-left:20px;line-height:1.6;margin:8px 0"><li>At the top, tap the small icon on the left of the web address (lock or sliders).</li><li>Tap <b>Permissions</b> or <b>Site settings</b> &#8594; <b>Microphone</b> &#8594; <b>Allow</b>.</li><li>If there is no Microphone there: phone <b>Settings &#8594; Apps &#8594; Chrome &#8594; Permissions &#8594; Microphone &#8594; Allow</b>.</li><li>Come back and reload this page.</li></ol><div class="muted">You can also type in the box instead.</div>`}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:20px;left:16px;right:16px;background:#1F2A44;color:#fff;padding:12px 14px;border-radius:14px;z-index:9';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(html,showBack){LASTVIEW=PENDINGVIEW;PENDINGVIEW=null;$('#app').innerHTML=html;$('#backBtn').classList.toggle('hidden',!showBack);if(!QUIET)window.scrollTo(0,0)}

/* ---------- home ---------- */
async function start(){if(!FTOK)return familyScreen();BOOT=await api('getBoot');refreshBundle();$('#appTitle').textContent=BOOT.appName;$('#todayLbl').textContent=BOOT.today;
 let t=null;try{t=JSON.parse(localStorage.getItem('ydAdmin')||'null')}catch(e){}
 if(t&&t.token){ADMIN=t;showFab();api('adminCheckToken',t.token).then(c=>{if(!c.ok){ADMIN=null;try{localStorage.removeItem('ydAdmin')}catch(e){}showFab();const n=getNav();if(n&&n.v==='admin')goHome()}else pollThread()}).catch(()=>{})}
 restoreNav()}
function restoreNav(){const n=getNav()||{v:'home'};const kid=n.id&&BOOT.children.find(c=>c.id===n.id);
 if(kid&&kid.introDone===false&&n.v==='talk')n.v='child';
 if(kid){CHILD=kid;if(n.v==='child')return openChild(n.id);if(n.v==='hw')return openHomework();if(n.v==='stars')return openStars();if(n.v==='videos')return openVideos();if(n.v==='talk')return openTalk(n.mode||'chat',true)}
 if(n.v==='admin'&&ADMIN)return adminHome(n.tab||'today');
 goHome()}
function showFab(){$('#askFab').classList.toggle('hidden',!ADMIN);if(ADMIN)updateDot()}
function setNav(o){try{localStorage.setItem('ydNav',JSON.stringify(o))}catch(e){}}
function getNav(){try{return JSON.parse(localStorage.getItem('ydNav')||'null')}catch(e){return null}}
function goHome(){setNav({v:'home'});PENDINGVIEW=()=>goHome();Voice.stop();if(RT){clearInterval(RT.timer);RT.audio&&RT.audio.pause();RT=null}CHILD=null;
 const colors={yuvaan:['#DCE6FB','#2A5FD6'],ditya:['#FBE1EE','#C2367C']};
 render(`<h1 style="margin:4px 0;font-size:28px">Who's learning today?</h1>`+
 BOOT.children.map(c=>{const col=colors[c.id]||['#eee','#333'];
  return `<button class="card big" onclick="openChild('${c.id}')"><div class="avatar" style="background-color:${col[0]};color:${col[1]};border:5px solid ${col[1]};${c.photoUrl?`background-image:url('${esc(c.photoUrl)}')`:''}">${c.photoUrl?'':esc(c.name[0])}</div>
  <div><div style="font-size:24px;font-weight:800">${esc(c.name)}</div><div class="muted">Helper: ${esc(c.helperName)} <span class="tag" style="background:#EEF1F7">computer helper</span></div></div></button>`}).join('')+
 `<div class="row" style="justify-content:flex-end"><button class="ghost" onclick="adminLoginScreen()">&#128274; Parents</button></div>`)}

/* ---------- child today ---------- */
async function openChild(id){setNav({v:'child',id:id});PENDINGVIEW=()=>openChild(id);CHILD=BOOT.children.find(c=>c.id===id);
 const t=await api('getToday',id);{const n=new Date();t.now=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')}
 const nowIdx=t.slots.findIndex((s,i)=>s.time<=t.now&&(!t.slots[i+1]||t.slots[i+1].time>t.now));
 render(`<div class="row" style="align-items:center;justify-content:space-between"><div style="font-size:24px;font-weight:800">Hi ${esc(CHILD.name)}!</div><span class="tag" style="background:#FFF1C9;color:#8A5A00;font-size:15px">${t.starsApproved} stars today</span></div>
 ${CHILD.introDone?'':`<button class="card big" style="background:#FFF1C9" onclick="openTalk('intro')"><span style="font-size:34px">&#128075;</span><div><div style="font-size:19px;font-weight:800">Meet your helper</div><div class="muted">Choose a name for your helper</div></div></button>`}
 <button class="primary" style="min-height:64px;font-size:19px" onclick="openTalk('${defaultMode(t)}')">Talk to ${esc(CHILD.helperName)}</button>
 <div class="grid2"><button class="ghost" onclick="openHomework()">Homework</button><button class="ghost" onclick="openStars()">My stars</button><button class="ghost" onclick="openVideos()">Videos</button><button class="ghost" onclick="openTalk('story')">Story</button></div>
 <div class="muted" style="font-weight:800">ROUTINES</div>
 <div class="grid2"><button class="ghost" onclick="openRoutine('brushing')">&#129701; Brushing</button><button class="ghost" onclick="openRoutine('washroom')">&#128703; Washroom</button><button class="ghost" onclick="openRoutine('ready')">&#128085; Get ready</button><button class="ghost" onclick="openRoutine('exercise')">&#129496; Exercise</button></div>
 <div class="muted" style="font-weight:800">TODAY</div>`+
 (t.slots.length?t.slots.map((s,i)=>`<div class="slot ${i===nowIdx?'now':''} ${s.fromAmma?'amma':''}"><span class="t">${esc(s.time)}</span><div><div style="font-weight:700">${esc(s.activity)}</div>${s.fromAmma?'<span class="tag" style="background:#FFE3A6;color:#8A5A00">From Amma</span>':''}</div></div>`).join(''):'<div class="card muted">Nothing planned yet.</div>'),true)}
function defaultMode(t){const n=t.now;if(n>=BOOT.morningEnd&&n<'14:00')return 'chat';if(n<BOOT.morningEnd)return 'morning';if(n>='14:00'&&n<'15:00')return 'fact';if(n>='15:00'&&n<'16:00')return 'homework';return 'chat'}

/* ---------- talk (hands-free voice) ---------- */
function openTalk(mode,restored){MODE=mode;if(mode!=='intro')setNav({v:'talk',id:CHILD.id,mode:mode});
 render(`<div class="muted" style="font-weight:800">${mode==='intro'?'Hello! Let\'s meet':'Talking with '+esc(CHILD.helperName)} <span class="tag" style="background:#EEF1F7">computer helper</span></div>
 <div id="clock" class="card hidden"></div>
 <div id="screenShow"></div>
 <div id="chat" style="display:flex;flex-direction:column;gap:8px"></div>
 <div id="micBtn" class="mic sleep" role="button" aria-label="Start talking" onclick="Voice.toggle()"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
 <div id="liveText" style="text-align:center;min-height:24px;font-size:17px;color:#2A5FD6"></div>
 <div class="muted" id="micHint" style="text-align:center">Say "Hey ${esc(CHILD.helperName)}" or tap the mic</div>
 <div class="row"><input id="typeBox" placeholder="Or type here" style="flex:1"><button class="primary" onclick="sendTyped()">Send</button></div>`,true);
 if(mode==='morning')clockTick();
 if(restored){$('#micHint').textContent='Tap the mic to start talking';return}
 Voice.begin(mode==='intro');
 if(mode==='intro')send('(child opened the app for the first time)')}
function clockTick(){const el=$('#clock');if(!el)return;const now=new Date(),[h,m]=BOOT.morningEnd.split(':');const end=new Date();end.setHours(+h,+m,0,0);const left=Math.max(0,Math.round((end-now)/60000));el.classList.remove('hidden');el.innerHTML=`<b>Minutes left: ${left}</b> <span class="muted">· ends ${BOOT.morningEnd}</span>`;setTimeout(clockTick,30000)}
function addBubble(who,text,cap){const c=$('#chat');if(!c)return;const d=document.createElement('div');d.className='bubble '+(who==='me'?'me':'helper');d.textContent=text;if(cap){const k=document.createElement('div');k.className='muted';k.style.marginTop='4px';k.textContent=cap;d.appendChild(k)}c.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'})}
function sendTyped(){const b=$('#typeBox');if(b.value.trim()){send(b.value.trim());b.value=''}}
async function send(text){if(!text.startsWith('('))addBubble('me',text);Voice.pause();
 addBubble('helper','• • •');const dots=$('#chat')&&$('#chat').lastElementChild;if(dots)dots.id='thinking';
 try{const r=await api('talk',CHILD.id,MODE,text);const th=$('#thinking');th&&th.remove();addBubble('helper',r.say||r.text,(r.say&&r.text&&r.text!==r.say)?r.text:'');showOnScreen(r.show);
  if(r.helperName){CHILD.helperName=r.helperName;CHILD.introDone=true;$('#micHint').textContent='Say "Hey '+r.helperName+'" any time'}
  await Voice.speak(r.say||r.text,r.lang||'te');
 }catch(e){const th=$('#thinking');th&&th.remove()}
 Voice.resume()}
async function showOnScreen(show){const box=$('#screenShow');if(!box||!show)return;
 if(show.startsWith('wiki:')){try{const t=encodeURIComponent(show.slice(5).trim());const j=await (await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+t)).json();if(j.thumbnail)box.innerHTML=`<img src="${esc((j.originalimage||j.thumbnail).source)}" alt="${esc(j.title)}">`}catch(e){}}
 if(show.startsWith('video:')){const vs=await api('getVideos',CHILD.id);const v=vs.find(x=>x.id===show.slice(6).trim());if(v){box.innerHTML=videoEmbed(v);api('markVideoShown',v.id)}}}

const Voice=(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 let rec=null,active=false,awake=false,paused=false,running=false,buf='',silT=null,lastHeard=0,startedAt=0,delay=300;
 const langFor=()=>({homework:'en-IN',check:'en-IN',olympiad:'en-IN',hindi:'hi-IN'}[MODE]||'te-IN');
 const hname=()=>(CHILD&&CHILD.helperName)||'Buddy';
 function status(t){const h=$('#micHint');if(h)h.textContent=t}
 function live(t){const l=$('#liveText');if(l)l.textContent=t}
 function setMic(){const m=$('#micBtn');if(!m)return;m.classList.toggle('listen',active&&awake&&!paused);m.classList.toggle('sleep',!(active&&awake));
  if(!active)status('Tap the mic to talk');else if(paused)return;else status(awake?'🎤 Listening… (tap the mic to stop)':'Say "Hey '+hname()+'" or tap the mic')}
 function flush(){clearTimeout(silT);const t=buf.trim();buf='';live('');if(!t||!awake||paused)return;process(t)}
 function process(said){const low=said.toLowerCase();
  if(/^(bye|బై)\b/i.test(low)){awake=false;active=false;abort();setMic();speak('సరే, మళ్ళీ పిలువు!','te');return}
  if(localCommand(said))return;
  send(said)}
 function abort(){try{rec&&rec.abort()}catch(e){}running=false}
 function listen(){if(!SR||!active||paused||running)return;
  rec=new SR();rec.lang=langFor();rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  rec.onstart=()=>{running=true;startedAt=Date.now();setMic()};
  rec.onresult=e=>{lastHeard=Date.now();let inter='';
   for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;
    if(e.results[i].isFinal){
     if(!awake){const low=t.toLowerCase(),n=hname().toLowerCase();
      if(low.includes(n)||low.includes('buddy')){awake=true;setMic();const rest=t.replace(new RegExp('(hey\\s*)?('+n+'|buddy)','i'),'').trim();if(rest.length>2){buf=rest;flush()}else{paused=true;speak('చెప్పు, నేను వింటున్నాను.','te').then(()=>{paused=false;setMic();listen()})}}
      continue}
     buf+=(buf?' ':'')+t.trim()}else inter+=t}
   if(awake){live((buf+' '+inter).trim());clearTimeout(silT);silT=setTimeout(flush,1500)}};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){active=false;awake=false;setMic();micHelp()}};
  rec.onend=()=>{running=false;if(buf.trim())flush();if(!active||paused)return;
   if(awake&&Date.now()-lastHeard>60000){active=false;awake=false;setMic();return}
   delay=(Date.now()-startedAt<1500)?Math.min(delay*2,3000):300;setTimeout(listen,delay)};
  try{rec.start()}catch(e){running=false}}

 function pickVoice(L){const vs=speechSynthesis.getVoices();const n=x=>String(x.lang).replace('_','-').toLowerCase();const want=L.toLowerCase(),base=want.slice(0,2);return vs.find(x=>n(x)===want&&/natural|online|google/i.test(x.name))||vs.find(x=>n(x)===want)||vs.find(x=>n(x).startsWith(base))}

  if(!v&&L!=='en-IN'){if(!warned[L]){warned[L]=1;toast((L==='te-IN'?'Telugu':'Hindi')+' voice is not installed on this device – reading on screen only')}return res()}
  const u=new SpeechSynthesisUtterance(text);u.lang=L;if(v)u.voice=v;u.rate=.95;u.onend=res;u.onerror=res;const h=$('#micHint');if(h&&paused)h.textContent='🔊 Speaking…';speechSynthesis.speak(u)})}

  toggle(){if(active&&awake){active=false;awake=false;buf='';live('');abort();setMic();return}this.begin(true)},

  stop(){active=false;awake=false;paused=false;buf='';clearTimeout(silT);abort();if(window.speechSynthesis)speechSynthesis.cancel()},speak}})();

function localCommand(said){const s=said.toLowerCase();
 if(/stop ?watch|స్టాప్ ?వాచ్|స్టాప్‌వాచ్/.test(s)){if(/stop|ఆపు|ఆపేయ్/.test(s.replace(/stop ?watch/,''))&&SW){stopStopwatch();return true}startStopwatch();return true}
 if(/timer|టైమర్/.test(s)){const n=numIn(s);if(!n){Voice.speak('ఎన్ని నిమిషాలు టైమర్ పెట్టాలి?','te');return true}const sec=/sec|సెకన్/.test(s)?n:n*60;startTimer(sec);return true}

 return false}

function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function startStopwatch(){const t0=Date.now();clearInterval(SW&&SW.i);SW={t0:t0,i:setInterval(()=>bigBox(mmss((Date.now()-t0)/1000)+'<div style="font-size:15px">stopwatch · say "stop" or tap</div>'),500)};$('#bigTimer')||bigBox('0:00');$('#bigTimer').onclick=stopStopwatch;Voice.speak('స్టాప్‌వాచ్ మొదలైంది!','te')}
function stopStopwatch(){if(!SW)return;const sec=(Date.now()-SW.t0)/1000;clearInterval(SW.i);SW=null;bigBox(mmss(sec)+'<div style="font-size:15px">done</div>');setTimeout(()=>{const b=$('#bigTimer');b&&b.remove()},4000);if(CHILD)api('logTimer',CHILD.id,'stopwatch','',Math.round(sec));Voice.speak('మొత్తం '+Math.floor(sec/60)+' నిమిషాల '+Math.round(sec%60)+' సెకన్లు. బాగుంది!','te')}

async function giveStar(){await api('adminGiveStar',ADMIN.token,$('#gsKid').value,$('#gsItem').value);toast('Star given');adminHome('stars')}
async function addInstr(){await api('adminAddInstruction',ADMIN.token,$('#iKid').value,$('#iDate').value,$('#iTime').value,$('#iKind').value,$('#iText').value);toast('Saved');adminHome('instr')}
async function addHw(){await api('adminAddHomework',ADMIN.token,$('#hKid').value,$('#hSub').value,$('#hKind').value,$('#hDet').value);toast('Homework added');adminHome('hw')}
async function addSlot(){await api('adminSaveSlot',ADMIN.token,null,$('#tKid').value,$('#tDays').value,$('#tTime').value,$('#tAct').value,'task',true);toast('Saved');adminHome('tt')}
async function addVid(){await api('adminAddVideo',ADMIN.token,$('#vKid').value,$('#vTitle').value,$('#vLink').value);toast('Video saved');adminHome('vid')}
async function addMusic(){await api('adminAddMusic',ADMIN.token,$('#mRt').value,$('#mTitle').value,$('#mLink').value,'');toast('Music added');adminHome('music')}
/* ---------- parents' Claude panel (works on every screen) ---------- */
let ASKREC=null,THREAD=null;
function screenName(){const app=$('#app');const first=(app.innerText||'').split('\n').map(x=>x.trim()).filter(Boolean)[0]||'';return ((CHILD&&!ADMIN_VIEW())?CHILD.name+' – ':'')+first.slice(0,60)}
function ADMIN_VIEW(){return /^Admin/.test(($('#app').innerText||'').trim())}
function askOpen(){if(!ADMIN)return;const p=$('#askPanel');p.classList.remove('hidden');
 p.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><b>&#10022; Claude</b><span class="muted" style="flex:1;margin-left:8px;font-size:12px">on: <span id="askScreen">${esc(screenName())}</span></span><button class="ghost" aria-label="Close" onclick="askClose()">&#10005;</button></div>
 <div id="thread" style="display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;margin:8px 0;padding:2px"><div class="muted">Loading…</div></div>
 <textarea id="askBox" rows="2" placeholder="Ask or say what to change – తెలుగులో చెప్పండి"></textarea>
 <div class="grid2" style="margin-top:8px"><button class="ghost" id="askMic" onclick="askMic()">&#127908; Speak</button><button class="green" onclick="askSend()">Send</button></div>
 <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="ghost" style="min-height:34px;font-size:13px" onclick="adminLock()">Lock (hide this button)</button></div>`;
 api('adminThread',ADMIN.token).then(drawThread).catch(()=>{})}
const RQ={'new':['#FFF1C9','Saved – will be built at the next check (within an hour)'],'building':['#E8F0FE','Being built…'],'done':['#E2F5EC','Done &#10003;'],'needs OK':['#FDECEC','Needs a parent&#39;s OK']};
function drawThread(list){THREAD=list;const box=$('#thread');if(!box)return;
 box.innerHTML=list.length?list.map(m=>{
  if(m.role==='parent')return `<div class="pmsg">${esc(m.text)}<div class="mt">${esc(m.by)} · ${esc(m.time)}</div></div>`;
  if(m.role==='status'&&m.request){const s=RQ[m.request.status]||['#EEF1F7',esc(m.request.status)];
   return `<div class="smsg"><span class="tag" style="background:${s[0]}">${s[1]}</span><div style="margin-top:4px">${esc(m.text)}</div>${m.request.note?`<div class="muted" style="margin-top:4px">${esc(m.request.note)}</div>`:''}${m.request.status==='done'?'<div class="mt">Close the app fully and open it again to see it.</div>':''}${m.request.status==='needs OK'?`<button class="green" style="margin-top:6px;min-height:38px" onclick="okReq('${m.request.id}')">OK, build it</button>`:''}</div>`}
  let x=`<div class="cmsg">${esc(m.text)}`;
  if(m.proposal){x+=`<div style="margin-top:8px;padding:8px;border-radius:10px;background:#fff"><b>Change:</b> ${esc(m.proposal.te)}${m.proposal.needsOk?'<div class="muted">This one needs a parent&#39;s OK after saving.</div>':''}`;
   if(m.proposal.state==='pending')x+=`<div class="grid2" style="margin-top:8px"><button class="green" style="min-height:40px" onclick="confirmP('${m.id}',true)">&#9989; Yes, make it</button><button class="ghost" style="min-height:40px;border:2px solid #DDE3EE" onclick="confirmP('${m.id}',false)">&#9999;&#65039; Change it</button></div>`;
   else x+=`<div class="mt">${m.proposal.state==='confirmed'?'&#10003; Confirmed':'Changed'}</div>`;x+='</div>'}
  return x+`<div class="mt">${esc(m.time)}</div></div>`}).join(''):'<div class="muted">Ask a question or say what you want changed. Example: "హోమ్‌వర్క్ బటన్ పెద్దదిగా చేయండి" or "How do I add homework?"</div>';
 box.scrollTop=box.scrollHeight;markSeen()}
function threadSig(list){return (list||[]).filter(m=>m.role!=='parent').map(m=>m.id+(m.request?m.request.status:'')).join('|')}
function markSeen(){try{localStorage.setItem('ydSeen',threadSig(THREAD))}catch(e){}updateDot()}
function updateDot(){const f=$('#askFab');if(!f)return;let seen='';try{seen=localStorage.getItem('ydSeen')||''}catch(e){}
 const t=THREAD||memGet(ckey('adminThread',[ADMIN&&ADMIN.token]));const show=!!(t&&t.length&&threadSig(t)!==seen&&$('#askPanel').classList.contains('hidden'));
 let d=f.querySelector('.dot');if(show&&!d){d=document.createElement('span');d.className='dot';f.appendChild(d)}if(!show&&d)d.remove()}
function pollThread(){if(!ADMIN)return;net('adminThread',[ADMIN.token]).then(t=>{memPut(ckey('adminThread',[ADMIN.token]),t);THREAD=t;if(!$('#askPanel').classList.contains('hidden')&&$('#thread'))drawThread(t);else updateDot()}).catch(()=>{})}
setInterval(()=>{if(document.visibilityState==='visible'&&ADMIN)pollThread()},60000);
async function askSend(){askStopMic();const t=$('#askBox').value.trim();if(!t)return;$('#askBox').value='';
 const box=$('#thread');if(box){box.insertAdjacentHTML('beforeend',`<div class="pmsg">${esc(t)}</div><div class="cmsg" id="thinkC">• • •</div>`);box.scrollTop=box.scrollHeight}
 try{const list=await api('adminChat',ADMIN.token,t,$('#askScreen').textContent);memPut(ckey('adminThread',[ADMIN.token]),list);drawThread(list)}catch(e){const c=$('#thinkC');c&&c.remove()}}
async function confirmP(id,yes){const box=$('#thread');if(box){box.insertAdjacentHTML('beforeend',`<div class="cmsg" id="thinkC">• • •</div>`);box.scrollTop=box.scrollHeight}
 try{const list=await api('adminConfirm',ADMIN.token,id,yes);memPut(ckey('adminThread',[ADMIN.token]),list);drawThread(list)}catch(e){const c=$('#thinkC');c&&c.remove()}}
async function okReq(id){await api('adminApproveRequest',ADMIN.token,id);pollThread()}
function askClose(){askStopMic();$('#askPanel').classList.add('hidden');updateDot()}
function askStopMic(){if(ASKREC){ASKREC.keep=false;try{ASKREC.r.stop()}catch(e){}ASKREC=null;const b=$('#askMic');if(b)b.innerHTML='&#127908; Speak'}}
function askMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice not supported here – please type');
 if(ASKREC)return askStopMic();Voice.stop();
 const box=$('#askBox');let base=box.value;const st={keep:true,r:null,last:Date.now()};ASKREC=st;$('#askMic').innerHTML='&#9632; Stop';
 const go=()=>{const r=new SR();st.r=r;r.lang='te-IN';r.continuous=true;r.interimResults=true;let fin='';
  r.onresult=e=>{st.last=Date.now();let inter='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t+' ';else inter+=t}box.value=(base+' '+fin+inter).trim()};
  r.onresult0=null;r.onend=()=>{base=(base+' '+fin).trim();if(st.keep&&Date.now()-st.last<60000)setTimeout(go,400);else askStopMic()};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){askClose();micHelp();st.keep=false}};
  try{r.start()}catch(e){}};go()}
async function askSend(){askStopMic();const t=$('#askBox').value.trim();if(!t)return;$('#askOut').textContent='Saving…';
 const r=await api('adminRequest',ADMIN.token,t,$('#askScreen').textContent);$('#askBox').value='';
 $('#askOut').innerHTML=esc(r.te)+(r.status==='needs OK'?'<br><b>This needs a parent\'s OK – open My requests.</b>':'<br>It will be built automatically – you will see Done &#10003; in My requests.')}
function adminLock(){askClose();ADMIN=null;try{localStorage.removeItem('ydAdmin')}catch(e){}showFab();goHome()}
function dictate(id){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice not supported');const r=new SR();r.lang='te-IN';r.onresult=e=>{$('#'+id).value+=(($('#'+id).value?' ':'')+e.results[0][0].transcript)};r.start()}

if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
