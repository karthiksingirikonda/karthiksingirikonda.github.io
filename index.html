<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Kartha is a team chat for site work, run by Karthik Singirikonda, Hyderabad.">
<title>Kartha — team chat for site work</title>
<style>
  :root { --bg: #fbf8f3; --card: #ffffff; --ink: #2b2a28; --muted: #6b6760; --line: #e8e2d8; --accent: #c2571a; --accent-l: #fdeee4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Telugu", "Noto Sans Devanagari", sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  .mark { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 18px; background: var(--accent); color: #fff;
          display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; }
  h1 { font-size: 30px; margin: 0; letter-spacing: 1px; }
  .tag { color: var(--muted); margin: 4px 0 28px; }
  a.btn { display: block; padding: 14px 16px; border-radius: 12px; text-decoration: none; font-weight: 600; margin-bottom: 12px; }
  a.main { background: var(--accent); color: #fff; }
  a.soft { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  a:focus-visible { outline: 3px solid #f0a874; outline-offset: 2px; }
  footer { color: var(--muted); font-size: 14px; margin-top: 24px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">K</div>
  <h1>KARTHA</h1>
  <p class="tag">Team chat for site work</p>

  <a class="btn main" href="/kartha/">Open Kartha</a>
  <a class="btn soft" href="/privacy.html">Privacy policy</a>
  <a class="btn soft" href="/delete-account.html">Delete account</a>

  <footer>
    Run by Karthik Singirikonda, Hyderabad, India<br>
    <a href="mailto:karthik.ca.1@gmail.com">karthik.ca.1@gmail.com</a>
  </footer>
</main>
</body>
</html>
